[project]
name = "poker-analyzer-backend"
version = "0.1.0"
description = "CoinPoker Hand History Analyzer API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "supabase",
    "httpx",
    "anthropic",
    "fastapi-mcp",
    "pydantic-settings",
    "python-multipart",
    "mangum",
    "asyncpg",
    "aiosqlite",
    "tzdata",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a live Postgres database",
]

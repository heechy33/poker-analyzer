version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8080"
    env_file: .env
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
